name: Update Assets

on:
  workflow_dispatch:
    inputs:
      sheet_range:
        description: 'Sheet range (e.g., 1-5, 1). Leave empty for auto-detect mode (only processes changed sheets).'
        required: false
        default: ''
      force:
        description: 'Force process all sheets, ignoring change detection'
        required: false
        default: false
        type: boolean
      optimize_images:
        description: 'Optimize images after generation'
        required: false
        default: true
        type: boolean
      skip_hash:
        description: 'Fast check: skip content hashing if folder exists (only detects NEW sheets)'
        required: false
        default: false
        type: boolean
      update_hashes_only:
        description: 'Update hash file only (no downloads or processing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ─── Lightweight hash check (sparse checkout, fast) ───────────────
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.hash_check.outputs.has_changes || steps.hash_check_fallback.outputs.has_changes }}
      changed_indices: ${{ steps.hash_check.outputs.changed_indices }}
    env:
      PYTHONUNBUFFERED: 1

    steps:
    - name: Determine if hash check should be skipped
      id: skip_logic
      run: |
        # Skip hash pre-check when manual range, force, or update_hashes_only is specified
        if [ -n "${{ github.event.inputs.sheet_range }}" ] || [ "${{ github.event.inputs.force }}" == "true" ] || [ "${{ github.event.inputs.update_hashes_only }}" == "true" ]; then
          echo "skip_check=true" >> $GITHUB_OUTPUT
          echo "⏭️  Manual mode — skipping hash pre-check"
        else
          echo "skip_check=false" >> $GITHUB_OUTPUT
          echo "🔍 Auto-detect mode — running hash pre-check"
        fi

    - name: Sparse checkout (scripts + hashes only)
      if: steps.skip_logic.outputs.skip_check == 'false'
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          assets/.sheet-hashes.json
          asset-map.json
          assets/all-cards.json
          assets/**/card-data.json
          scripts/
          requirements.txt
        sparse-checkout-cone-mode: false

    - name: Set up Python
      if: steps.skip_logic.outputs.skip_check == 'false'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Cache pip dependencies
      if: steps.skip_logic.outputs.skip_check == 'false'
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install minimal dependencies
      if: steps.skip_logic.outputs.skip_check == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests tqdm

    - name: Check for sheet changes
      id: hash_check
      if: steps.skip_logic.outputs.skip_check == 'false'
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        set -euo pipefail
        echo "🔍 Checking for updates in Google Sheets..."
        
        SKIP_HASH_FLAG=""
        if [ "${{ github.event.inputs.skip_hash }}" == "true" ]; then
          SKIP_HASH_FLAG="--skip-hash"
          echo "⚡ Fast check enabled (skipping content hashing)"
        fi

        python scripts/download_sheets.py check $SKIP_HASH_FLAG 2>&1 | tee check_output.log
        
        if grep -q "No sheets changed" check_output.log; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "changed_indices=" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ No sheets changed — build will be skipped!"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          INDICES=$(grep "CHANGED_INDICES=" check_output.log | cut -d'=' -f2)
          echo "changed_indices=$INDICES" >> $GITHUB_OUTPUT
          echo ""
          echo "📋 Changes detected in indices: $INDICES"
        fi

    - name: Set changes flag (skipped check)
      id: hash_check_fallback
      if: steps.skip_logic.outputs.skip_check == 'true'
      run: |
        echo "has_changes=true" >> $GITHUB_OUTPUT
        echo "changed_indices=" >> $GITHUB_OUTPUT

  # ─── Full build (only runs when needed) ───────────────────────────
  build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1

    steps:
    - name: Sparse checkout (scripts + current assets)
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          scripts/
          assets/.sheet-hashes.json
          asset-map.json
          assets/all-cards.json
          assets/**/card-data.json
          requirements.txt
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests openpyxl Pillow tqdm

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git config --global http.postBuffer 524288000
        git config --global core.quotepath false

    - name: Cleanup deleted worksheets
      if: github.event.inputs.sheet_range == '' && github.event.inputs.force != 'true' && github.event.inputs.update_hashes_only != 'true'
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        set -euo pipefail
        echo "🧹 Checking for deleted worksheets..."
        python scripts/download_sheets.py cleanup 2>&1 | tee cleanup.log
        if grep -q "DELETED:" cleanup.log; then
          git add --sparse assets/ asset-map.json
          git commit -m "Remove deleted worksheets [skip ci]" && git push || true
        fi

    - name: Update Hashes Only
      if: github.event.inputs.update_hashes_only == 'true'
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        set -euo pipefail
        echo "🔄 Updating sheet hashes only..."
        python scripts/download_sheets.py check --update-hashes 2>&1 | tee update_hashes.log
        git add --sparse assets/.sheet-hashes.json
        git commit -m "Update sheet hashes only [skip ci]" && git push || true

    - name: Manual Range Download & Process
      if: github.event.inputs.sheet_range != ''
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        set -euo pipefail
        RANGE="${{ github.event.inputs.sheet_range }}"
        if echo "$RANGE" | grep -q "-"; then
          START=$(echo "$RANGE" | cut -d'-' -f1)
          END=$(echo "$RANGE" | cut -d'-' -f2)
        else
          START=$RANGE
          END=$RANGE
        fi
        SUCCESS_COUNT=0
        FAIL_COUNT=0
        for i in $(seq $START $END); do
          echo "📦 Sheet $i"
          python scripts/download_sheets.py download-one $i --force 2>&1 | tee download.log
          if ! grep -q "DOWNLOADED" download.log; then continue; fi
          XLSX=$(ls Downloads/*.xlsx 2>/dev/null | head -1)
          [ -z "$XLSX" ] && continue
          FOLDER_NAME=$(basename "$XLSX" .xlsx)
          [ -d "assets/$FOLDER_NAME" ] && git sparse-checkout add "$FOLDER_NAME" && rm -rf "assets/$FOLDER_NAME"
          python scripts/generate_info_json.py
          [ "${{ github.event.inputs.optimize_images }}" == "true" ] && python scripts/optimize_images.py "$FOLDER_NAME"
          git add --sparse assets/ asset-map.json
          git commit -m "Update $FOLDER_NAME [skip ci]" && git push || true
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
        done

    - name: Auto-Detect & Process Per Worksheet
      if: github.event.inputs.sheet_range == '' && github.event.inputs.update_hashes_only != 'true'
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        CHANGED_INDICES: ${{ needs.check-changes.outputs.changed_indices }}
      run: |
        set -euo pipefail
        if [ -n "$CHANGED_INDICES" ]; then
          INDICES="$CHANGED_INDICES"
          echo "📋 Processing specifically changed indices: $INDICES"
        else
          TOTAL=$(python scripts/download_sheets.py count)
          INDICES=$(seq 1 $TOTAL)
          echo "📋 Processing all $TOTAL worksheets"
        fi
        FORCE_FLAG=""
        [ "${{ github.event.inputs.force }}" == "true" ] && FORCE_FLAG="--force"
        PROCESSED=0
        for i in $INDICES; do
          echo "🔍 Processing $i..."
          python scripts/download_sheets.py download-one $i $FORCE_FLAG 2>&1 | tee download.log
          if grep -q "SKIPPED" download.log; then continue; fi
          if ! grep -q "DOWNLOADED" download.log; then continue; fi
          XLSX=$(ls Downloads/*.xlsx 2>/dev/null | head -1)
          [ -z "$XLSX" ] && continue
          FOLDER_NAME=$(basename "$XLSX" .xlsx)
          [ -d "assets/$FOLDER_NAME" ] && git sparse-checkout add "$FOLDER_NAME" && rm -rf "assets/$FOLDER_NAME"
          python scripts/generate_info_json.py
          [ "${{ github.event.inputs.optimize_images }}" == "true" ] && python scripts/optimize_images.py "$FOLDER_NAME"
          git add --sparse assets/ asset-map.json
          git commit -m "Update $FOLDER_NAME [skip ci]" && git push || true
          PROCESSED=$((PROCESSED + 1))
        done

    - name: Finalize Hashes and Merge
      if: github.event.inputs.update_hashes_only != 'true'
      run: |
        if [ -f "assets/.sheet-hashes.json" ]; then
          git add --sparse assets/.sheet-hashes.json
          git commit -m "Update sheet hashes [skip ci]" && git push || true
        fi
        python scripts/merge_datasets.py || true
        if [ -f "assets/all-cards.json" ]; then
          git add --sparse assets/all-cards.json asset-map.json
          git commit -m "Update merged dataset [skip ci]" && git push || true
        fi
